long_description = """
Fetches front cover art from the public iTunes Search API (itunes.apple.com), with images served from mzstatic.com.

Needs no account and no API key. Useful as a fallback when the Cover Art Archive has no image for a release, or is unreachable.

Because iTunes is searched by artist and album text rather than MusicBrainz ID, each candidate is scored on title, edition, artist and track count, and only confident matches are accepted. A wrong cover is never silently attached.

Enable it under Options > Cover Art and place it after Cover Art Archive so it is only used when no front cover was found."""
